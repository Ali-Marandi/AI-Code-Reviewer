name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile translations and run unit tests
        run: |
          pyside6-lrelease translations/ai_code_reviewer_fa.ts -qm translations/ai_code_reviewer_fa.qm
          python -m py_compile core/ai_engine.py core/i18n.py ui/main_window.py app.py
          python -m unittest discover -s tests -v

      - name: Build EXE with local Enterprise Rule Pack
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AI-Code-Reviewer-Enterprise --add-data "rules;rules" --add-data "translations;translations" app.py

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/AI-Code-Reviewer-Enterprise.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
