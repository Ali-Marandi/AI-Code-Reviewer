<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      body { margin: 0; }
      .slide-container { 
        width: 1280px; 
        min-height: 720px; 
        background: #E9ECEF; 
        font-family: 'Segoe UI', sans-serif;
        position: relative;
        overflow: hidden;
      }
      .header-block {
        padding-top: 60px;
        padding-left: 60px;
        width: 1100px;
      }
      h2 {
        font-size: 64px;
        font-weight: 800;
        color: #212529;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .modular-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 20px; /* reduced gap to save vertical space */
        padding-top: 20px; /* reduced top padding to pull grid up */
        padding-left: 60px;
        padding-right: 60px;
      }
      .module-card {
        background: #FFFFFF;
        padding-top: 18px; /* reduced inner padding */
        padding-left: 20px;
        padding-right: 20px;
        min-height: 380px;
        clip-path: polygon(0 0, 100% 0, 100% 90%, 90% 100%, 0 100%);
        border-top: 6px solid #20C997;
      }
      .module-card.accent {
        border-top-color: #FFC107;
      }
      .icon-circle {
        width: 60px;
        height: 60px;
        background: #212529;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px; /* slightly reduced */
      }
      .icon-circle i {
        color: #20C997;
        font-size: 28px;
      }
      .accent .icon-circle i {
        color: #FFC107;
      }
      h3 {
        font-size: 24px;
        font-weight: 800;
        color: #212529;
        margin-bottom: 12px; /* reduced spacing */
        line-height: 1.2;
      }
      .module-content {
        font-size: 16px;
        color: #495057;
        line-height: 1.6;
      }
      .module-content b {
        color: #20C997;
      }
      .accent .module-content b {
        color: #212529;
      }
      .bg-geometric {
        position: absolute;
        bottom: -50px;
        right: -50px;
        width: 300px;
        height: 300px;
        background: #FFC107;
        clip-path: polygon(100% 0, 0 100%, 100% 100%);
        opacity: 0.1;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="bg-geometric"></div>
        <div class="header-block">
            <h2>Global Scalability<br>& Compliance</h2>
        </div>
        <div class="modular-grid">
            <div class="module-card">
                <div class="icon-circle">
                    <i class="fas fa-chart-pie"></i>
                </div>
                <h3>B2B SaaS Pricing</h3>
                <div class="module-content">
                    Tiered annual subscription projected to scale <b>ARR</b> across international markets.
                </div>
            </div>
            <div class="module-card accent">
                <div class="icon-circle">
                    <i class="fas fa-balance-scale"></i>
                </div>
                <h3>Compliance Readiness</h3>
                <div class="module-content">
                    Aligned with <b>GDPR</b>, with a roadmap to <b>SOC 2 Type II</b>.
                </div>
            </div>
            <div class="module-card">
                <div class="icon-circle">
                    <i class="fas fa-desktop"></i>
                </div>
                <h3>Automated Monitoring</h3>
                <div class="module-content">
                    Real-time visibility via <b>Prometheus &amp; Grafana</b> ensuring 99.9% uptime.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
