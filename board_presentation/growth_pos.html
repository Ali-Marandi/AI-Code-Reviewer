<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      body { margin: 0; }
      .slide-container { 
        width: 1280px; 
        min-height: 720px; 
        background: #E9ECEF; 
        font-family: 'Segoe UI', sans-serif;
        position: relative;
        overflow: hidden;
      }
      .geometric-circle {
        position: absolute;
        top: -100px;
        right: -100px;
        width: 600px;
        height: 600px;
        background: #20C997;
        border-radius: 50%;
        opacity: 0.8;
        z-index: 1;
      }
      .accent-box {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 400px;
        height: 200px;
        background: #FFC107;
        clip-path: polygon(0 0, 100% 100%, 0 100%);
        z-index: 1;
      }
      .content {
        position: relative;
        z-index: 10;
        padding-top: 120px;
        padding-left: 80px;
        width: 800px;
      }
      h1 {
        font-size: 72px;
        font-weight: 800;
        color: #212529;
        text-transform: uppercase;
        line-height: 0.9;
        margin-bottom: 40px;
      }
      .points {
        margin-top: 60px;
        display: flex;
        flex-direction: column;
        gap: 25px;
      }
      .point {
        display: flex;
        align-items: center;
        gap: 15px;
        font-size: 22px;
        color: #212529;
        font-weight: 600;
      }
      .point i {
        color: #20C997;
      }
      .highlight { color: #20C997; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="geometric-circle"></div>
        <div class="accent-box"></div>
        <div class="content">
            <h1>Strategic<br>Growth & Market<br><span class="highlight">Position</span></h1>
            <div class="points">
                <div class="point"><i class="fas fa-check-circle"></i> V1.0.2 Release Successfully Deployed</div>
                <div class="point"><i class="fas fa-check-circle"></i> High-Performance Desktop Architecture</div>
                <div class="point"><i class="fas fa-check-circle"></i> Capturing DevSecOps Market with IP Privacy</div>
            </div>
        </div>
    </div>
</body>
</html>
